name: Publish team MCP image

# Builds the hosted team MCP and pushes it to GHCR, where the Karwan VPS pulls
# it from.
#
# THIS IMAGE CARRIES THE TEAM CANON. Positioning, the decisions log, the
# roadmap. GHCR packages default to private and this one must stay that way.
# Check the package visibility after the first push, because a public image
# here is the whole canon published with no way to unpublish it.

on:
  push:
    branches: [main]
    paths:
      - 'canon/**'
      - 'packages/**'
      - 'package.json'
      # Every file below changes what the image contains or whether it builds at
      # all. pnpm-workspace.yaml was missing from this list, so the commit that
      # fixed a broken install did not rebuild the broken image.
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - '.nvmrc'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/publish-mcp-image.yml'
  workflow_dispatch:

concurrency:
  group: publish-mcp-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The canon has to be valid before it is baked into an image somebody
      # will read from. A container that boots on a half-parsed canon serves
      # silence where a fact used to be, and nobody can tell the difference
      # between "we do not claim that" and "that file did not load".
      - name: Canon validates
        run: pnpm canon:validate

      - name: Leak guard
        run: pnpm canon:guard

      - name: Tests
        run: pnpm test

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA=${GITHUB_SHA::7}
          echo "image=ghcr.io/${REPO_LOWER}/karwan-team-mcp" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}:latest
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.sha }}
          cache-from: type=registry,ref=${{ steps.tags.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.tags.outputs.image }}:buildcache,mode=max
          platforms: linux/amd64

  # The image above is only what the server could run. Without this job nothing
  # pulled it: the backend deploy leaves this service alone on purpose, so the
  # hosted MCP kept answering from the canon of the day somebody last pulled by
  # hand.
  update-server:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_SERVER: ${{ secrets.VPS_HOST != '' && secrets.VPS_SSH_KEY != '' }}
    steps:
      - name: Server secrets are set
        if: env.HAS_SERVER != 'true'
        run: |
          echo "::warning::VPS_HOST or VPS_SSH_KEY is not set in this repository, so the server keeps its old canon. Pull by hand: ops/hosting-the-team-mcp.md"

      - name: Pull and restart the team MCP
        if: env.HAS_SERVER == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -eu
            cd ~/karwan
            # This service depends on karwan-api in the compose file. With the
            # tag unset compose reads the API as `:latest`, an image from weeks
            # ago, so the tag the API runs is always passed and the API is never
            # touched (--no-deps).
            TAG="$(cat .deployed-tag 2>/dev/null || true)"
            if [ -z "$TAG" ]; then
              echo "no .deployed-tag on the server; refusing to guess the API tag"
              exit 1
            fi
            export KARWAN_API_TAG="$TAG"
            IMAGE="ghcr.io/iziedking/karwan-content-os/karwan-team-mcp"
            PREV="$(docker inspect -f '{{.Image}}' karwan-team-mcp 2>/dev/null || true)"
            if [ -n "${{ secrets.VPS_GHCR_TOKEN }}" ]; then
              echo "${{ secrets.VPS_GHCR_TOKEN }}" | docker login ghcr.io \
                -u "${{ secrets.VPS_GHCR_USER }}" --password-stdin
            fi
            docker compose pull karwan-team-mcp
            docker compose up -d --no-deps karwan-team-mcp
            healthy() {
              for i in $(seq 1 30); do
                s="$(docker inspect -f '{{.State.Health.Status}}' karwan-team-mcp 2>/dev/null || echo none)"
                [ "$s" = "healthy" ] && return 0
                sleep 2
              done
              return 1
            }
            if healthy; then
              docker exec karwan-team-mcp wget -qO- http://127.0.0.1:8790/health
              echo
              docker image prune -f
              exit 0
            fi
            echo "new image did not become healthy"
            docker logs --tail 40 karwan-team-mcp || true
            if [ -n "$PREV" ]; then
              echo "going back to the image that was running"
              docker tag "$PREV" "$IMAGE:latest"
              docker compose up -d --no-deps karwan-team-mcp
              healthy || echo "the previous image is not healthy either"
            fi
            exit 1
