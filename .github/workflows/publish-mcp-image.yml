name: Publish team MCP image

# Builds the hosted team MCP and pushes it to GHCR, where the Karwan VPS pulls
# it from.
#
# THIS IMAGE CARRIES THE TEAM CANON. Positioning, the decisions log, the
# roadmap. GHCR packages default to private and this one must stay that way.
# Check the package visibility after the first push, because a public image
# here is the whole canon published with no way to unpublish it.

on:
  push:
    branches: [main]
    paths:
      - 'canon/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/publish-mcp-image.yml'
  workflow_dispatch:

concurrency:
  group: publish-mcp-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The canon has to be valid before it is baked into an image somebody
      # will read from. A container that boots on a half-parsed canon serves
      # silence where a fact used to be, and nobody can tell the difference
      # between "we do not claim that" and "that file did not load".
      - name: Canon validates
        run: pnpm canon:validate

      - name: Leak guard
        run: pnpm canon:guard

      - name: Tests
        run: pnpm test

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHA=${GITHUB_SHA::7}
          echo "image=ghcr.io/${REPO_LOWER}/karwan-team-mcp" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}:latest
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.sha }}
          cache-from: type=registry,ref=${{ steps.tags.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.tags.outputs.image }}:buildcache,mode=max
          platforms: linux/amd64
