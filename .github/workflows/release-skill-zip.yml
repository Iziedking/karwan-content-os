name: Release Karwan skill ZIP

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-skill-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Validate skill package
        run: node packages/skill/src/validate.js

      - name: Test ZIP contract
        run: node packages/skill/src/archive.test.js

      - name: Build deterministic archive
        run: node packages/skill/src/build-zip.js

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: karwan-skill
          path: packages/skill/karwan-skill.zip
          if-no-files-found: error

      - name: Create GitHub Release with ZIP
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" packages/skill/karwan-skill.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" packages/skill/karwan-skill.zip --generate-notes --title "$GITHUB_REF_NAME"
          fi
